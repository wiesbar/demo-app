[versions]
kotlin = "2.2.21"
kotlin-detekt-pin = "2.0.21"
spring-boot = "4.0.5"
kover = "0.9.8"
ktlint = "14.2.0"
detekt = "1.23.8"
kotest = "5.9.1"
kotest-spring = "1.3.0"
testcontainers = "1.20.4"
kotlin-logging = "7.0.7"

[plugins]
kotlin-jvm    = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot   = { id = "org.springframework.boot",           version.ref = "spring-boot" }
kover         = { id = "org.jetbrains.kotlinx.kover",        version.ref = "kover" }
ktlint        = { id = "org.jlleitschuh.gradle.ktlint",      version.ref = "ktlint" }
detekt        = { id = "io.gitlab.arturbosch.detekt",        version.ref = "detekt" }

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

kotlinLogging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }

kotest-bom               = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
kotest-runner-junit5     = { module = "io.kotest:kotest-runner-junit5" }
kotest-datatest          = { module = "io.kotest:kotest-framework-datatest" }
kotest-extensions-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotest-spring" }

testcontainers-bom           = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-elasticsearch = { module = "org.testcontainers:elasticsearch" }
